; Runs the API server, queue worker, and scheduler as one process group in a
; single container — used only when RUN_ALL_IN_ONE=true (see entrypoint.sh),
; which is how the single Render backend instance gets all three
; responsibilities without three separate Railway-style services. If any
; child crashes, supervisord restarts just that one; the container itself
; stays up as long as supervisord's own process (PID 1) is alive.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:octane]
command=/bin/sh -c "php artisan octane:start --server=frankenphp --host=0.0.0.0 --port=${PORT:-8080} --workers=${OCTANE_WORKERS:-4} --max-requests=${OCTANE_MAX_REQUESTS:-500}"
directory=/app
user=www-data
autostart=true
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue-worker]
command=php artisan queue:work --tries=3 --max-time=3600
directory=/app
user=www-data
autostart=true
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=php artisan schedule:work
directory=/app
user=www-data
autostart=true
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
